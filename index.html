<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved / system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafafa"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0c0c"
    />

    <!-- Title & description are managed per-route via TanStack Router's head API.
         Static social/canonical tags below are for crawlers that don't run JS. -->
    <meta name="author" content="Patrick Obama" />
    <meta
      name="keywords"
      content="portfolio, full-stack developer, nextjs, tanstack, typescript, react, patrick obama"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tracepanic.com/" />
    <meta
      property="og:title"
      content="Patrick Obama — Frontend & Docs Engineer"
    />
    <meta
      property="og:description"
      content="Full-stack developer building secure, performant web applications with Next.js, NestJS, TanStack, TypeScript and PostgreSQL."
    />
    <meta property="og:image" content="https://tracepanic.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tracepanic.com/" />
    <meta
      name="twitter:title"
      content="Patrick Obama — Frontend & Docs Engineer"
    />
    <meta
      name="twitter:description"
      content="Full-stack developer building secure, performant web applications with Next.js, NestJS, TanStack, TypeScript and PostgreSQL."
    />
    <meta name="twitter:image" content="https://tracepanic.com/og.png" />

    <link rel="canonical" href="https://tracepanic.com/" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
